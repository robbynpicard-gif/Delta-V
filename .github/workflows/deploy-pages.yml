name: Deploy DELTA-V prototype to Pages
on:
  push:
    branches: [prototype/orbital-manoeuvres-v0.1]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: delta-v-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload playable website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Allow GitHub artifact indexing to settle
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
