<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DELTA-V — Orbital Toy 0.1</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;background:#080f1d;color:#e7f2f4}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.overlay{position:fixed;pointer-events:none;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,3vw,30px)}
header,footer{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{font-size:17px;letter-spacing:.29em;font-weight:600;margin:0 0 7px}.sub,.small{font-size:11px;letter-spacing:.09em;color:#8da8b4}.stats{display:flex;gap:25px;margin-top:17px}.stat strong{display:block;font-size:19px;font-weight:450;letter-spacing:.02em;margin-top:5px}.stat span{font-size:10px;color:#8da8b4;text-transform:uppercase;letter-spacing:.12em}
.controls{display:flex;gap:7px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}button{border:1px solid #385365;background:#101f30bb;color:#d4e9ee;border-radius:7px;padding:10px 13px;cursor:pointer;font:inherit;font-size:12px}button:hover{border-color:#85beca}button:focus-visible{outline:2px solid #a3d6dd}button[aria-pressed=true]{border-color:#b6e9df;background:#213b42}
.hint{max-width:450px;font-size:13px;line-height:1.6;color:#b3cbd2;background:#0a1524bb;border:1px solid #294052;border-radius:9px;padding:13px 16px}
.status{font-size:11px;letter-spacing:.1em;color:#9eb9c4;text-align:right;max-width:250px}
footer{align-items:flex-end}.accent{color:#a6e6db}.mobile-tip{display:none}
@media(max-width:600px){.stats{gap:15px}.stat strong{font-size:15px}.overlay{padding:15px}.controls{max-width:165px}.hint{font-size:11px;max-width:68%;padding:10px}.status{font-size:10px}.mobile-tip{display:inline}}
</style></head><body><canvas id="space" aria-label="Interactive orbital manoeuvre simulator"></canvas>
<div class="overlay"><header><div><h1>DELTA-V <span class="small">/ 0.1</span></h1><div class="sub">AN ORBITAL STUDY</div>
<div class="stats"><div class="stat"><span>Delta-v remaining</span><strong id="fuel">—</strong></div><div class="stat"><span>Orbit</span><strong id="orbit">—</strong></div><div class="stat"><span>Speed</span><strong id="speed">—</strong></div></div></div>
<div class="controls"><button id="pause" title="Pause or resume simulation">Pause</button><button id="reset">Reset</button><button id="audio" aria-pressed="false">Sound off</button></div></header>
<footer><div class="hint" id="hint"><span class="accent">HOLD</span> the spacecraft to pause time.<br><span class="accent">DRAG</span> along its flight direction to plan a burn.<br><span class="accent">RELEASE</span> to ignite. Drag back to zero to cancel.<br><span class="mobile-tip">Touch and hold works too.</span></div><div class="status" id="status">COASTING · PLANETARY ORBIT</div></footer></div>
<script>
(()=>{'use strict';
const c=document.getElementById('space'),g=c.getContext('2d'),ui={fuel:document.getElementById('fuel'),orbit:document.getElementById('orbit'),speed:document.getElementById('speed'),hint:document.getElementById('hint'),status:document.getElementById('status'),pause:document.getElementById('pause'),reset:document.getElementById('reset'),audio:document.getElementById('audio')};
const MU=100000, R=30, START=180, MAX_DV=32, MAX_BURN=22, STEP=.028, TRAIL_MAX=450;
let w=0,h=0,dpr=1,scale=1,center={x:0,y:0},s,trail=[],time=0,paused=false,drag=null,pred=[],last=performance.now(),accum=0,stars=[],audioCtx=null,sound=false,lastOrbitNote=-1,flash=0,record=START;
const len=(x,y)=>Math.hypot(x,y);const grav=(x,y)=>{const r=Math.max(R*.75,len(x,y));const k=-MU/(r*r*r);return {x:x*k,y:y*k}};
function reset(){s={x:START,y:0,vx:0,vy:Math.sqrt(MU/START),dv:MAX_DV,dead:false};time=0;trail=[];drag=null;pred=[];paused=false;accum=0;record=START;lastOrbitNote=-1;ui.pause.textContent='Pause';ui.status.textContent='COASTING · PLANETARY ORBIT'}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0);center={x:w/2,y:h/2+Math.min(35,h*.045)};scale=Math.min(w/550,h/510,1.65);stars=Array.from({length:90},(_,i)=>({x:(i*97.17%1)*w,y:(i*61.73%1)*h,a:.08+(i*17%11)/110,r:i%9===0?1:.55}))}
function world(x,y){return {x:center.x+x*scale,y:center.y-y*scale}}
function integrate(a,dt){const q=grav(a.x,a.y);a.vx+=q.x*dt*.5;a.vy+=q.y*dt*.5;a.x+=a.vx*dt;a.y+=a.vy*dt;const p=grav(a.x,a.y);a.vx+=p.x*dt*.5;a.vy+=p.y*dt*.5;return len(a.x,a.y)}
function orbitName(a){const r=len(a.x,a.y),v2=a.vx*a.vx+a.vy*a.vy,energy=v2/2-MU/r;if(energy>=0)return 'ESCAPE';const angular=Math.abs(a.x*a.vy-a.y*a.vx);const ecc=Math.sqrt(Math.max(0,1+2*energy*angular*angular/(MU*MU)));return ecc<.08?'CIRCULAR':ecc<.45?'ELLIPTICAL':'ECCENTRIC'}
function forecast(){pred=[];if(!drag)return;const a={x:s.x,y:s.y,vx:s.vx,vy:s.vy};const v=len(s.vx,s.vy)||1;a.vx+=s.vx/v*drag.dv;a.vy+=s.vy/v*drag.dv;for(let i=0;i<1550;i++){const r=integrate(a,.075);if(i%3===0)pred.push({x:a.x,y:a.y});if(r<R||r>1500)break}}
function audioInit(){if(!sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){sound=false}}
function note(freq,dur=.4,volume=.018,type='sine'){if(!sound)return;audioInit();if(!audioCtx)return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);a.gain.setValueAtTime(.0001,now);a.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.025);a.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(a);a.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.02)}
function commit(){if(!drag)return;const d=drag.dv;if(Math.abs(d)>.25){const v=len(s.vx,s.vy);s.vx+=s.vx/v*d;s.vy+=s.vy/v*d;s.dv-=Math.abs(d);flash=1;note(d>0?293.66:220,.65,.028);setTimeout(()=>note(d>0?440:329.63,.7,.011),115);ui.status.textContent=d>0?'PROGRADE BURN':'RETROGRADE BURN'}drag=null;pred=[]}
function eventPos(e){return {x:e.clientX,y:e.clientY}}
c.addEventListener('pointerdown',e=>{if(s.dead)return;const p=world(s.x,s.y);if(len(e.clientX-p.x,e.clientY-p.y)>Math.max(25,20*scale))return;e.preventDefault();c.setPointerCapture(e.pointerId);const v=len(s.vx,s.vy);drag={id:e.pointerId,start:eventPos(e),dv:0,tx:s.vx/v,ty:s.vy/v};audioInit();note(392,.18,.008);forecast();ui.status.textContent='PLANNING MANOEUVRE'});
c.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=(e.clientX-drag.start.x)/scale,dy=-(e.clientY-drag.start.y)/scale;const projection=dx*drag.tx+dy*drag.ty;drag.dv=Math.max(-Math.min(MAX_BURN,s.dv),Math.min(MAX_BURN,s.dv,projection*.14));forecast()});
c.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.id)commit()});c.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){drag=null;pred=[];ui.status.textContent='MANOEUVRE CANCELLED'}});
ui.pause.onclick=()=>{paused=!paused;ui.pause.textContent=paused?'Resume':'Pause';ui.status.textContent=paused?'PAUSED':'COASTING'};ui.reset.onclick=()=>{reset();note(330,.25,.012)};ui.audio.onclick=()=>{sound=!sound;ui.audio.textContent=sound?'Sound on':'Sound off';ui.audio.setAttribute('aria-pressed',String(sound));if(sound){audioInit();note(392,.45,.015);setTimeout(()=>note(493.88,.65,.012),160)}};
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target.tagName!=='BUTTON'){e.preventDefault();ui.pause.click()}if(e.key==='Escape'&&drag){drag=null;pred=[];ui.status.textContent='MANOEUVRE CANCELLED'}if(e.key.toLowerCase()==='r'&&e.target.tagName!=='BUTTON')ui.reset.click()});
function path(pts,color,width=1,dash=[]){if(pts.length<2)return;g.save();g.strokeStyle=color;g.lineWidth=width;g.setLineDash(dash);g.beginPath();pts.forEach((p,i)=>{const z=world(p.x,p.y);i?g.lineTo(z.x,z.y):g.moveTo(z.x,z.y)});g.stroke();g.restore()}
function draw(t){g.clearRect(0,0,w,h);const bg=g.createRadialGradient(center.x,center.y,40,center.x,center.y,Math.max(w,h)*.8);bg.addColorStop(0,'#102337');bg.addColorStop(.6,'#0b1729');bg.addColorStop(1,'#070e1b');g.fillStyle=bg;g.fillRect(0,0,w,h);
for(const st of stars){g.globalAlpha=st.a;g.fillStyle='#bdd8dc';g.beginPath();g.arc(st.x,st.y,st.r,0,Math.PI*2);g.fill()}g.globalAlpha=1;
const p=world(0,0),rad=R*scale,halo=g.createRadialGradient(p.x,p.y,rad*.6,p.x,p.y,rad*3.2);halo.addColorStop(0,'#58a6b32d');halo.addColorStop(1,'#58a6b300');g.fillStyle=halo;g.beginPath();g.arc(p.x,p.y,rad*3.2,0,7);g.fill();
const planet=g.createRadialGradient(p.x-rad*.4,p.y-rad*.5,rad*.1,p.x,p.y,rad*1.3);planet.addColorStop(0,'#81c2c1');planet.addColorStop(.45,'#427f96');planet.addColorStop(1,'#172c50');g.fillStyle=planet;g.beginPath();g.arc(p.x,p.y,rad,0,7);g.fill();g.strokeStyle='#8acbc45b';g.lineWidth=1;g.stroke();
g.strokeStyle='#567c8d22';g.lineWidth=1;g.beginPath();g.arc(p.x,p.y,START*scale,0,7);g.stroke();
path(trail,'#8cc2c94a',1.2);if(drag){path(pred,drag.dv>=0?'#a6ead5':'#efc6a1',1.9,[5,5]);const vx=drag.tx,vy=drag.ty,base=world(s.x,s.y),end=world(s.x+vx*drag.dv*7,s.y+vy*drag.dv*7);g.strokeStyle=drag.dv>=0?'#a6ead5':'#efc6a1';g.lineWidth=2.5;g.setLineDash([]);g.beginPath();g.moveTo(base.x,base.y);g.lineTo(end.x,end.y);g.stroke();g.fillStyle=g.strokeStyle;g.beginPath();g.arc(end.x,end.y,4,0,7);g.fill();
const cost=Math.abs(drag.dv).toFixed(1);g.fillStyle='#dff4ef';g.font='13px system-ui';g.textAlign='center';g.fillText((drag.dv>=0?'+':'')+drag.dv.toFixed(1)+' m/s',base.x,base.y-38);g.fillStyle='#9bb7c1';g.font='11px system-ui';g.fillText('COST '+cost+' / '+s.dv.toFixed(1)+' m/s',base.x,base.y-22)}
const craft=world(s.x,s.y),a=Math.atan2(-s.vy,s.vx);g.save();g.translate(craft.x,craft.y);g.rotate(a);if(flash>0){g.fillStyle='#bceee5';g.globalAlpha=flash*.7;g.beginPath();g.moveTo(-11,0);g.lineTo(-23-flash*14,-4);g.lineTo(-23-flash*14,4);g.fill();g.globalAlpha=1}g.fillStyle='#e9faf6';g.strokeStyle='#83c6c9';g.lineWidth=1;g.beginPath();g.moveTo(12,0);g.lineTo(-9,-7);g.lineTo(-6,0);g.lineTo(-9,7);g.closePath();g.fill();g.stroke();g.restore();
if(drag){g.strokeStyle='#a8e8dc55';g.lineWidth=1;g.beginPath();g.arc(craft.x,craft.y,19+Math.sin(t/200)*2,0,7);g.stroke()}
if(s.dead){g.fillStyle='#efb7a8';g.font='16px system-ui';g.textAlign='center';g.fillText('SIGNAL LOST — RESET TO TRY AGAIN',w/2,h*.65)}
ui.fuel.textContent=s.dv.toFixed(1)+' m/s';ui.orbit.textContent=s.dead?'IMPACT':orbitName(s);ui.speed.textContent=len(s.vx,s.vy).toFixed(1)+' m/s';flash=Math.max(0,flash-.035)}
function frame(now){const elapsed=Math.min((now-last)/1000,.06);last=now;if(!paused&&!drag&&!s.dead){accum+=elapsed*2.2;let n=0;while(accum>=STEP&&n++<12){accum-=STEP;time+=STEP;const r=integrate(s,STEP);if(r<=R){s.dead=true;ui.status.textContent='IMPACT · EXPEDITION ENDED';note(130,.9,.025,'triangle');break}if(r>record)record=r;if(n%2===0){trail.push({x:s.x,y:s.y});if(trail.length>TRAIL_MAX)trail.shift()}const orbit=Math.floor(time/48);if(orbit>lastOrbitNote){lastOrbitNote=orbit;if(orbit>0)note([261.63,329.63,392][orbit%3],.8,.007)}}}draw(now);requestAnimationFrame(frame)}
resize();reset();addEventListener('resize',resize);requestAnimationFrame(frame);
})();
</script></body></html>
